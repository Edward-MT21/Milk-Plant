services:
    rabbit:
        image: rabbitmq:3.13-management
        hostname: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: rabbitmq-diagnostics check_port_connectivity
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 5s
        networks:
            - milk-plant-network

    config-server-s:
        image: "edwarddocker270/config-server:s6"
        container_name: milk-collection-ms
        ports:
            - "8071:8071"
        deploy:
            resources:
                limits:
                    memory: 500M
        networks:
            - milk-plant-network
        healthcheck:
            test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        depends_on:
            rabbit:
                condition: service_healthy

    milk-collection-s:
        image: "edwarddocker270/milk-collection:s6"
        container_name: milk-collection-ms
        ports:
            - "8080:8080"
        deploy:
            resources:
                limits:
                    memory: 500M
        networks:
            - milk-plant-network
        environment:
            SPRING_CONFIG_IMPORT: "configserver:http://config-server-s:8071/"
            SPRING_PROFILES_ACTIVE: default
            SPRING_APPPLICATION_NAME: "Milk-Collection"
        depends_on:
            config-server-s:
                condition: service_healthy

    persons-s:
        image: "edwarddocker270/persons:s6"
        container_name: persons-ms
        ports:
            - "9090:9090"
        deploy:
            resources:
                limits:
                    memory: 700M
        networks:
            - milk-plant-network
        environment:
            SPRING_CONFIG_IMPORT: "configserver:http://config-server-s:8071/"
            SPRING_PROFILES_ACTIVE: default
            SPRING_APPPLICATION_NAME: "Persons"
        depends_on:
            config-server-s:
                condition: service_healthy

    financial-management-s:
        image: "edwarddocker270/financial-management:s6"
        container_name: financial-management-ms
        ports:
            - "7070:7070"
        deploy:
            resources:
                limits:
                    memory: 500M
        networks:
            - milk-plant-network
        environment:
            SPRING_CONFIG_IMPORT: "configserver:http://config-server-s:8071/"
            SPRING_PROFILES_ACTIVE: default
            SPRING_APPPLICATION_NAME: "Financial-Management"
        depends_on:
            config-server-s:
                condition: service_healthy

networks:
    milk-plant-network:
        driver: "bridge"


