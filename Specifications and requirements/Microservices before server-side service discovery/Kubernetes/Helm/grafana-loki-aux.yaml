apiVersion: v1
kind: Secret
metadata:
  name: release-name-alloy
  namespace: default
type: Opaque
stringData:
  alloy.yaml: |
    loki.source.docker "default" {
      host = "unix:///var/run/docker.sock"
      forward_to = [loki.process.docker.receiver]
    }

    loki.process "docker" {
      stage.labels {
        values = {
          source    = "docker",
          container = "{{ .container_name }}",
          image     = "{{ .container_image }}",
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://release-name-grafana-loki-gateway:80/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: release-name-grafanaalloy
  namespace: default
  labels:
    app.kubernetes.io/name: grafana-loki
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/component: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-loki
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-loki
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: alloy
    spec:
      serviceAccountName: default
      containers:
        - name: alloy
          image: grafana/alloy:v1.1.0
          args: ["run", "/etc/alloy/alloy.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: config
          secret:
            secretName: release-name-alloy
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock