spring.application.name=API-Gateway
server.port=8080

#Inventory service routes
spring.cloud.gateway.routes[0].id=inventory-service
#spring.cloud.gateway.routes[0].uri=http://localhost:8084 -- Before Eureka
spring.cloud.gateway.routes[0].uri=lb://Inventory
spring.cloud.gateway.routes[0].predicates[0]=Path=/InventoryController/**

#Orders service routes
spring.cloud.gateway.routes[1].id=orders-service
#spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].uri=lb://Orders
spring.cloud.gateway.routes[1].predicates[0]=Path=/OrderController/**

#Orders service routes
spring.cloud.gateway.routes[2].id=milk-collection-service
#spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].uri=lb://Milk-Collection
spring.cloud.gateway.routes[2].predicates[0]=Path=/PersonController/**

#Eureka client
#eureka.client.service-url.default-zone=http://localhost:8761/eureka Before Security
eureka.client.service-url.default-zone=http://eureka:password@localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

#Log
logging.level.root=info
#logging.level.org.springframework.cloud.gateway=debug
logging.level.org.springframework.cloud.gateway=trace
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=info

#Discovery Server routes
spring.cloud.gateway.routes[3].id=discovery-service
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

#Discovery Server Static routes **
spring.cloud.gateway.routes[4].id=discovery-service-static
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**

#Keycloak

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8181/realms/microservices-realm

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.registration.keycloak.client-id=microservices_client
spring.security.oauth2.client.registration.keycloak.client-secret=OXqkSSDQIYjCEmRXpdSb46cjQ8S2IfgX
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

#Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/actuator

#Actuator routes
#Inventory actuator routes
spring.cloud.gateway.routes[5].id=inventory-service-actuator
spring.cloud.gateway.routes[5].uri=lb://Inventory/actuator/inventory/**
spring.cloud.gateway.routes[5].predicates[0]=Path=/actuator/inventory/**

#Orders actuator routes
spring.cloud.gateway.routes[6].id=orders-service-actuator
spring.cloud.gateway.routes[6].uri=lb://Orders/actuator/orders/**
spring.cloud.gateway.routes[6].predicates[0]=Path=/actuator/orders/**

#Products actuator routes
spring.cloud.gateway.routes[7].id=milk-collection-service-actuator
spring.cloud.gateway.routes[7].uri=lb://Milk-Collection/actuator/milk-collection/**
spring.cloud.gateway.routes[7].predicates[0]=Path=/actuator/milk-collection/**


spring.cloud.gateway.default-filters[0]=SaveSession
spring.cloud.gateway.default-filters[1]=TokenRelay

#Tracing
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

logging.pattern.level= %5p [${spring.application.name}, %X{traceId:-}, %X{spanId:-}]

#Discovery actuator routes
spring.cloud.gateway.routes[8].id=discovery-service-actuator
spring.cloud.gateway.routes[8].uri=http://localhost:8761/actuator/discovery/**
spring.cloud.gateway.routes[8].predicates[0]=Path=/actuator/discovery/**