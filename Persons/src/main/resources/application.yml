server:
  port: 8180
spring:
  application:
    name: "Persons"
  profiles:
    active: "qa"
  datasource:
    url: jdbc:mysql://localhost:3307/persons-db
    username: root
    password: root
#      url: jdbc:h2:mem:testdb #h2
#      driver-class-name: org.h2.Driver #h2
#      username: sa #h2
#      password: "" #h2
  jpa:
    show-sql: true
#    database-platform: org.hibernate.dialect.H2Dialect #h2
#    hibernate: #h2
#      ddl-auto: update #h2
#    h2: #h2
#      console: #h2
#        enabled: true #h2
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"
#  cloud:
#    kubernetes:
#      discovery:
#        all-namespaces: true
  cloud:
    stream:
      bindings:
        # Nombre del canal de salida que usaremos en el código
        personDeleted-out-0:
          destination: person-deleted-topic # Nombre del tópico en Kafka
      kafka:
        binder:
          brokers:
            - localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
#    fetchRegistry: false #h2
#    registerWithEureka: false #h2
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "Persons"
    description: "Persons microservice"
    version: "1.0.0"

logging:
  level:
    com:
      persons:
        Persons: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
