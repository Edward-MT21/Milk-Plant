<div class="payment-container">
  <div class="header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Pagos a Proveedores de Leche</h1>
  </div>
  
  <div class="content">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
        <!-- Columna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID Proveedor</th>
          <td mat-cell *matCellDef="let element">{{element.id}}</td>
        </ng-container>

        <!-- Columna Nombre Completo -->
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Proveedor</th>
          <td mat-cell *matCellDef="let element">{{element.fullName}}</td>
        </ng-container>

        <!-- Columna Total Litros -->
        <ng-container matColumnDef="totalLiters">
          <th mat-header-cell *matHeaderCellDef>Total Litros</th>
          <td mat-cell *matCellDef="let element">{{element.totalLiters | number:'1.2-2'}} L</td>
        </ng-container>

        <!-- Columna Pago Acumulado -->
        <ng-container matColumnDef="accumulatedPayment">
          <th mat-header-cell *matHeaderCellDef>Pago Acumulado</th>
          <td mat-cell *matCellDef="let element">$ {{element.accumulatedPayment | number:'1.2-2'}}</td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="viewDetails(element.id)" title="Ver detalles">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
