<div class="person-register-container">
  
  <h2 class="person-register-title">📄 Registro de Persona</h2>

  <!-- Mensajes de feedback -->
  <div class="feedback-messages">
    <div class="success-message" *ngIf="successMessage">
      ✅ {{ successMessage }}
    </div>
    <div class="error-message" *ngIf="errorMessage">
      ❌ {{ errorMessage }}
    </div>
    <div class="loading-message" *ngIf="isLoading">
      ⏳ Guardando datos...
    </div>
  </div>

  <form>
    <label>Nombre:</label>
    <input [(ngModel)]="names" name="names" />

    <label>Apellido:</label>
    <input [(ngModel)]="lastNames" name="lastNames" />

    <label>Número de Identificación:</label>
    <input [(ngModel)]="identificationNumber" name="identificationNumber" />

    <label>Fecha de Nacimiento:</label>
    <input 
      type="date" 
      [(ngModel)]="birthdate" 
      name="birthdate" 
      [max]="maxDate"
    />

    <label>Género:</label>
    <select [(ngModel)]="gender" name="gender" class="form-select">
      <option *ngFor="let option of genderOptions" [value]="option">
        {{ option }}
      </option>
    </select>

    <label>Email:</label>
    <input [(ngModel)]="email" name="email" type="email" />

    <label>Teléfono:</label>
    <input [(ngModel)]="mobileNumber" name="mobileNumber" />

    <div class="actions">
      <button 
        type="button" 
        class="guardar-btn" 
        (click)="guardar()" 
        [disabled]="isLoading">
        <span *ngIf="!isLoading">Guardar</span>
        <span *ngIf="isLoading">Guardando...</span>
      </button>
      <button 
        type="button" 
        class="cancelar-btn" 
        (click)="cancelar()" 
        [disabled]="isLoading">
        Cancelar
      </button>
    </div>
  </form>
</div>
