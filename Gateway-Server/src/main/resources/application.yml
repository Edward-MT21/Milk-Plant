spring:
  application:
    name: "Gateway-Server"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted #enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "Gateway-Server"
    description: "Gateway Server microservice"
    version: "1.0.0"
