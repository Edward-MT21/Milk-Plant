server:
  port: 8080
spring:
  application:
    name: "Milk-Collection"
  profiles:
    active: "qa"
  datasource:
    url: jdbc:mysql://localhost:3306/milk-collection-db
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    # import: "optional:configserver:http..."
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "Milk-Collection"
    description: "Milk Collection microservice"
    version: "1.0.0"

logging:
  level:
    com:
      module:
        Milk_Collection: DEBUG