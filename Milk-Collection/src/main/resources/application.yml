server:
  port: 8080
spring:
  application:
    name: "Milk-Collection"
  profiles:
    active: "qa"
  datasource:
    url: jdbc:mysql://localhost:3306/milk-collection-db
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    # import: "optional:configserver:http..."
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"