server:
  port: 7070
spring:
  application:
    name: "Financial-Management"
  profiles:
    active: "qa"
  datasource:
    url: jdbc:mysql://localhost:3308/financial-management-db
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"

